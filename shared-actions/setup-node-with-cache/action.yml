name: 'Setup Node with Enhanced Caching'
description: 'Setup Node.js with yarn caching and GitHub packages registry. Supports both setup-node and asdf-vm.'
inputs:
  node-version:
    description: 'Node.js version to use (ignored if use-asdf is true)'
    required: false
    default: '20'
  use-asdf:
    description: 'Use asdf-vm for version management (reads from .tool-versions)'
    required: false
    default: 'false'
  GH_TOKEN:
    description: 'GitHub token for private packages'
    required: true
  enable-yarn-cache:
    description: 'Enable yarn global cache (~/.cache/yarn)'
    required: false
    default: 'true'
  cache-mode:
    description: 'Cache strategy: "full" (node_modules + yarn cache), "node_modules-only", or "yarn-cache-only"'
    required: false
    default: 'full'
  disable-restore-keys:
    description: 'Disable restore-keys to avoid restoring stale caches (forces exact key match)'
    required: false
    default: 'false'
  package-manager:
    description: 'Package manager to use: "yarn" or "pnpm"'
    required: false
    default: "yarn"
  save-cache:
    description: >
      When to save the dependency (and asdf) cache after a miss.
      "auto" saves on the default branch, and elsewhere only when no cache at all was
      restored (so a repo that never runs this on main still gets a cache).
      "default-branch" saves only on the default branch (restore-only on PRs and merge queues).
      "never" is restore-only (use it in downstream/parallel jobs).
      "always" saves after every miss (the behaviour before this input existed).
    required: false
    default: 'auto'
  cache-key-strategy:
    description: >
      "dependencies" keys the cache on the lockfile plus the dependency fields of every
      package.json, so version bumps (changesets releases) keep hitting the cache.
      "legacy" keys on hashFiles of the lockfile and every package.json, as before.
    required: false
    default: 'dependencies'

outputs:
  cache-hit:
    description: '"true" when node_modules was restored from an exact key match'
    value: ${{ steps.restore-cache.outputs.cache-hit }}
  cache-key:
    description: 'Primary key of the dependency cache'
    value: ${{ steps.cache-key.outputs.key }}
  cache-matched-key:
    description: 'Key of the cache that was restored (exact or restore-key match), empty on a cold miss'
    value: ${{ steps.restore-cache.outputs.cache-matched-key }}

runs:
  using: 'composite'
  steps:
    # Caches are restored with actions/cache/restore and saved explicitly with
    # actions/cache/save, so the save (minutes for a multi-GB node_modules) only happens
    # where it pays off. See the save-cache input and the README.
    - name: Resolve cache save policy
      id: save-policy
      shell: bash
      env:
        SAVE_CACHE: ${{ inputs.save-cache }}
        KEY_STRATEGY: ${{ inputs.cache-key-strategy }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        REF: ${{ github.ref }}
      run: |
        case "$SAVE_CACHE" in
          ''|auto) MODE=auto ;;  # empty: forwarded from an unset reusable-workflow input
          always|default-branch|never) MODE="$SAVE_CACHE" ;;
          true) MODE=always ;;
          false) MODE=never ;;
          *)
            echo "::error::save-cache must be one of auto, always, default-branch, never (got '$SAVE_CACHE')"
            exit 1
            ;;
        esac
        case "$KEY_STRATEGY" in
          ''|dependencies|legacy) ;;
          *)
            echo "::error::cache-key-strategy must be 'dependencies' or 'legacy' (got '$KEY_STRATEGY')"
            exit 1
            ;;
        esac

        # Some events (e.g. schedule) carry no repository payload: assume main/master.
        if [ -n "$DEFAULT_BRANCH" ]; then
          [ "$REF" == "refs/heads/$DEFAULT_BRANCH" ] && ON_DEFAULT=true || ON_DEFAULT=false
        else
          case "$REF" in refs/heads/main|refs/heads/master) ON_DEFAULT=true ;; *) ON_DEFAULT=false ;; esac
        fi

        echo "Cache save policy: $MODE (ref: $REF, default branch: ${DEFAULT_BRANCH:-unknown}, on default branch: $ON_DEFAULT)"
        echo "mode=$MODE" >> "$GITHUB_OUTPUT"
        echo "on-default-branch=$ON_DEFAULT" >> "$GITHUB_OUTPUT"

    # Cache 1: asdf installations (Node.js and package manager binaries)
    # This cache is separate because it only changes when .tool-versions is updated,
    # which happens infrequently (only when upgrading Node/package manager versions).
    # By caching it separately, we avoid re-downloading binaries on every dependency change.
    - name: Restore asdf installations
      if: ${{ inputs.use-asdf == 'true' && !env.ACT }}
      uses: actions/cache/restore@v6
      id: asdf-cache
      with:
        path: |
          ~/.asdf/installs
          ~/.asdf/plugins
        key: ${{ runner.os }}-${{ runner.arch }}-asdf-${{ hashFiles('**/.tool-versions') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-asdf-

    - name: Set up Node.js with asdf
      if: ${{ inputs.use-asdf == 'true' }}
      uses: asdf-vm/actions/install@v4

    - name: Save asdf installations
      if: >-
        ${{ inputs.use-asdf == 'true' && !env.ACT && steps.asdf-cache.outputs.cache-hit != 'true' && (
          steps.save-policy.outputs.mode == 'always' ||
          (steps.save-policy.outputs.mode != 'never' && steps.save-policy.outputs.on-default-branch == 'true') ||
          (steps.save-policy.outputs.mode == 'auto' && steps.asdf-cache.outputs.cache-matched-key == '')
        ) }}
      uses: actions/cache/save@v6
      with:
        path: |
          ~/.asdf/installs
          ~/.asdf/plugins
        key: ${{ steps.asdf-cache.outputs.cache-primary-key }}

    - name: Reshim asdf after cache restore
      if: ${{ inputs.use-asdf == 'true' && steps.asdf-cache.outputs.cache-hit == 'true' }}
      shell: bash
      run: |
        asdf reshim nodejs
        if [ "${{ inputs.package-manager }}" == "pnpm" ]; then
          asdf reshim pnpm
        else
          asdf reshim yarn
        fi
    
    - name: Set up Node.js with setup-node
      if: ${{ inputs.use-asdf != 'true' }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
    
    # pnpm must be installed before Node setup so setup-node can wire pnpm's built-in cache.
    # Skip when asdf manages pnpm via .tool-versions.
    - name: Set up pnpm
      if: ${{ inputs.package-manager == 'pnpm' && inputs.use-asdf != 'true' }}
      uses: pnpm/action-setup@v4
      with:
        run_install: false
    
    - name: Get yarn cache directory path
      if: ${{ inputs.package-manager != 'pnpm' }}
      id: yarn-cache-dir-path
      shell: bash
      run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

    - name: Get pnpm store path
      if: ${{ inputs.package-manager == 'pnpm' }}
      id: pnpm-store-path
      shell: bash
      run: echo "dir=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

    - name: Set GitHub packages registry
      shell: bash
      run: |
        npm config set '//npm.pkg.github.com/:_authToken' ${{ inputs.GH_TOKEN }}
        npm config set @typeform:registry https://npm.pkg.github.com/
    
    # Cache 2: package manager dependencies (node_modules and package-manager global cache)
    # This cache changes whenever the lockfile or a dependency field of a package.json is
    # modified (see dependency-cache-key.mjs; cache-key-strategy: legacy keys on every package.json).
    # It's separate from the asdf cache so that dependency updates don't invalidate
    # the cached Node.js binaries, making builds more efficient.
    # Note: restore-keys allows partial matches, which can restore stale caches.
    # If you need to force a fresh install, manually delete old caches at:
    # https://github.com/Typeform/<repo>/actions/caches
    
    # Determine cache paths based on cache-mode input
    - name: Set cache paths (yarn)
      id: cache-paths
      if: ${{ inputs.package-manager != 'pnpm' }}
      shell: bash
      run: |
        CACHE_MODE="${{ inputs.cache-mode }}"
        
        case "$CACHE_MODE" in
          "node_modules-only")
            echo "Cache mode: node_modules only (no yarn cache)"
            PATHS="node_modules
        apps/**/node_modules
        packages/**/node_modules"
            ;;
          "yarn-cache-only")
            echo "Cache mode: yarn cache only (no node_modules)"
            PATHS="~/.cache/yarn"
            ;;
          "pnpm-store-only")
            echo "::error::cache-mode 'pnpm-store-only' is invalid when package-manager=yarn. Use 'yarn-cache-only' or 'full'."
            exit 1
            ;;
          "full"|*)
            echo "Cache mode: full (node_modules + yarn cache)"
            PATHS="node_modules
        apps/**/node_modules
        packages/**/node_modules
        ~/.cache/yarn"
            ;;
        esac
        
        # Write paths to output using heredoc to preserve newlines
        echo "paths<<EOF" >> $GITHUB_OUTPUT
        echo "$PATHS" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
        # Set cache key suffix based on mode
        echo "key-suffix=-$CACHE_MODE" >> $GITHUB_OUTPUT
        
    - name: Set cache paths (pnpm)
      id: cache-paths-pnpm
      if: ${{ inputs.package-manager == 'pnpm' }}
      shell: bash
      run: |
        CACHE_MODE="${{ inputs.cache-mode }}"
        PNPM_STORE="${{ steps.pnpm-store-path.outputs.dir }}"

        case "$CACHE_MODE" in
          "node_modules-only")
            echo "Cache mode: node_modules only (no pnpm store)"
            PATHS="node_modules
        apps/**/node_modules
        packages/**/node_modules"
            ;;
          "pnpm-store-only")
            echo "Cache mode: pnpm store only (no node_modules)"
            PATHS="$PNPM_STORE"
            ;;
          "yarn-cache-only")
            echo "::error::cache-mode 'yarn-cache-only' is invalid when package-manager=pnpm. Use 'pnpm-store-only' or 'full'."
            exit 1
            ;;
          "full"|*)
            echo "Cache mode: full (node_modules + pnpm store)"
            PATHS="node_modules
        apps/**/node_modules
        packages/**/node_modules
        $PNPM_STORE"
            ;;
        esac

        echo "paths<<EOF" >> $GITHUB_OUTPUT
        echo "$PATHS" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

        echo "key-suffix=-$CACHE_MODE" >> $GITHUB_OUTPUT
    
    - name: Compute dependency cache key
      id: cache-key
      if: ${{ !env.ACT }}
      shell: bash
      env:
        PM: ${{ inputs.package-manager == 'pnpm' && 'pnpm' || 'yarn' }}
        KEY_STRATEGY: ${{ inputs.cache-key-strategy }}
        KEY_SUFFIX: ${{ steps.cache-paths.outputs.key-suffix || steps.cache-paths-pnpm.outputs.key-suffix }}
        # Only evaluated for the legacy strategy (&& short-circuits).
        LEGACY_HASH: ${{ inputs.cache-key-strategy == 'legacy' && (inputs.package-manager == 'pnpm' && hashFiles('**/pnpm-lock.yaml', '**/package.json') || hashFiles('**/yarn.lock', '**/package.json')) || '' }}
      run: |
        PREFIX="${RUNNER_OS}-${RUNNER_ARCH}-${PM}-"
        if [ "${KEY_STRATEGY:-dependencies}" == "legacy" ]; then
          KEY="${PREFIX}${LEGACY_HASH}${KEY_SUFFIX}"
        else
          HASH=$(node "$GITHUB_ACTION_PATH/dependency-cache-key.mjs" "$PM")
          KEY="${PREFIX}deps-${HASH}${KEY_SUFFIX}"
        fi
        echo "Dependency cache key (${KEY_STRATEGY:-dependencies}): $KEY"
        echo "key=$KEY" >> "$GITHUB_OUTPUT"
        echo "restore-prefix=$PREFIX" >> "$GITHUB_OUTPUT"

    - name: Restore dependency cache
      if: ${{ !env.ACT }}
      uses: actions/cache/restore@v6
      id: restore-cache
      with:
        path: ${{ steps.cache-paths.outputs.paths || steps.cache-paths-pnpm.outputs.paths }}
        key: ${{ steps.cache-key.outputs.key }}
        restore-keys: ${{ inputs.disable-restore-keys != 'true' && steps.cache-key.outputs.restore-prefix || '' }}

    - name: Debug cache contents
      id: debug-cache
      if: ${{ !env.ACT && steps.restore-cache.outputs.cache-hit == 'true' }}
      shell: bash
      run: |
        set +e  # Don't exit on error - we want to continue even if find fails

        PM="${{ inputs.package-manager }}"

        echo "=== 🔍 Cache Debug Info ==="
        echo "Cache key: ${{ steps.cache-key.outputs.key }}"
        echo ""
    
        echo "=== 📦 Root node_modules Status ==="
        if [ -d "node_modules" ]; then
          MODULE_COUNT=$(ls -1 node_modules 2>/dev/null | wc -l | tr -d ' ')
          echo "✅ node_modules exists"
          echo "📊 Package count: $MODULE_COUNT"
          if [ "$PM" == "pnpm" ]; then
            echo "🔒 pnpm integrity: $([ -f 'node_modules/.modules.yaml' ] && echo '✅ present' || echo '❌ missing')"
          else
            echo "🔒 Yarn integrity: $([ -f 'node_modules/.yarn-integrity' ] && echo '✅ present' || echo '❌ missing')"
          fi
        else
          echo "❌ node_modules directory not found"
        fi
        echo ""
        
        echo "=== 🏢 Workspace Structure ==="
        # Use find with || true to prevent failures when directories don't exist
        WORKSPACE_PACKAGES=$(find packages/*/package.json apps/*/package.json -type f 2>/dev/null || true | wc -l | tr -d ' ')
        WORKSPACE_MODULES=$(find packages/*/node_modules apps/*/node_modules -maxdepth 0 -type d 2>/dev/null || true | wc -l | tr -d ' ')
        echo "📦 Workspace packages: $WORKSPACE_PACKAGES"
        echo "🔗 Workspace node_modules: $WORKSPACE_MODULES"
        
        if [ "$WORKSPACE_PACKAGES" -gt 0 ]; then
          echo ""
          echo "Workspace packages found:"
          find packages/*/package.json apps/*/package.json -type f 2>/dev/null || true | sed 's|/package.json||' | sed 's|^|  - |'
        fi
        echo ""
        
        set -e  # Re-enable exit on error
    
    - name: Clean stale nested node_modules on restore-key fallback
      if: ${{ !env.ACT && steps.restore-cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        # When actions/cache reports cache-hit != 'true', it means either:
        # 1. Complete cache miss (no node_modules directory exists)
        # 2. Restore-key fallback (stale node_modules from a previous lockfile)
        #
        # Case 2 is dangerous: install --frozen-lockfile installs the correct
        # top-level packages but does NOT delete leftover nested node_modules/ dirs
        # from the stale cache. This causes version conflicts (e.g., @types/react@17
        # persisting inside a dependency's node_modules after upgrading to React 18).
        #
        # Fix: if node_modules exists (restore-key fallback), purge all nested
        # node_modules directories inside dependencies before install.

        PM="${{ inputs.package-manager }}"

        if [ -d "node_modules" ]; then
          echo "=== 🧹 Stale Cache Cleanup ==="
          echo "Cache was restored via restore-key fallback (not exact match)"
          echo "Cleaning nested node_modules to prevent version conflicts..."
          
          # Count nested node_modules before cleanup
          NESTED_COUNT=$(find node_modules -mindepth 2 -name node_modules -type d 2>/dev/null | wc -l | tr -d ' ')
          echo "📦 Found $NESTED_COUNT nested node_modules directories"
          
          if [ "$NESTED_COUNT" -gt 0 ]; then
            # Remove all nested node_modules inside dependencies.
            # This forces yarn install to re-resolve them correctly based on the
            # current lockfile, preventing stale transitive dependencies.
            find node_modules -mindepth 2 -name node_modules -type d -exec rm -rf {} + 2>/dev/null || true
            
            # Also clean nested node_modules in workspace packages
            find packages/*/node_modules -mindepth 2 -name node_modules -type d -exec rm -rf {} + 2>/dev/null || true
            find apps/*/node_modules -mindepth 2 -name node_modules -type d -exec rm -rf {} + 2>/dev/null || true
            
            echo "✅ Cleaned nested node_modules — install will re-resolve them"
          else
            echo "✅ No nested node_modules found — nothing to clean"
          fi
          
          # Remove integrity file so install runs a full resolution
          if [ "$PM" == "pnpm" ]; then
            rm -f node_modules/.modules.yaml
            echo "🔒 Removed .modules.yaml to force full resolution"
          else
            rm -f node_modules/.yarn-integrity
            echo "🔒 Removed .yarn-integrity to force full resolution"
          fi
        else
          echo "📭 No node_modules directory — clean cache miss, nothing to clean"
        fi
    
    - name: Check if install needed on cache hit
      id: check-install-needed
      if: ${{ !env.ACT }}
      shell: bash
      run: |
        set +e  # Don't exit on error - we want to check all conditions
        
        # Determine if we need to run install even when cache hits.
        #
        # Why this matters:
        # - Cache restores node_modules, but doesn't run postinstall hooks
        # - Monorepos need workspace linking even with cached node_modules
        # - Some projects have critical postinstall scripts (e.g., building native modules)
        # - Cached node_modules might be incomplete or corrupted
        #
        # We detect scenarios that require yarn install on cache hit:
        
        PM="${{ inputs.package-manager }}"
        NEEDS_INSTALL=false

        CACHE_HIT="${{ steps.restore-cache.outputs.cache-hit }}"
        if [ "$PM" == "pnpm" ]; then
          INTEGRITY_FILE="node_modules/.modules.yaml"
        else
          INTEGRITY_FILE="node_modules/.yarn-integrity"
        fi
        
        # On cache hit, verify cache integrity before trusting it
        if [ "$CACHE_HIT" == "true" ]; then
          echo "=== 🔍 Verifying Cache Integrity ==="
          
          # Verification 1: Check if node_modules exists and has content
          if [ ! -d "node_modules" ]; then
            echo "❌ node_modules directory missing - forcing install"
            NEEDS_INSTALL=true
          else
            MODULE_COUNT=$(ls -1 node_modules 2>/dev/null | wc -l | tr -d ' ')
            if [ "$MODULE_COUNT" -lt 5 ]; then
              echo "⚠️ node_modules appears empty ($MODULE_COUNT packages) - forcing install"
              NEEDS_INSTALL=true
            fi
          fi
          
          # Verification 2: Check integrity file
          if [ "$NEEDS_INSTALL" == "false" ] && [ ! -f "$INTEGRITY_FILE" ]; then
            echo "⚠️ Missing $INTEGRITY_FILE - cache may be incomplete, forcing install"
            NEEDS_INSTALL=true
          fi
          
          # Verification 3: For workspaces, verify workspace packages have node_modules
          if [ "$NEEDS_INSTALL" == "false" ]; then
            WORKSPACE_PACKAGES=$(find packages/*/package.json apps/*/package.json -type f 2>/dev/null || true | wc -l | tr -d ' ')
            if [ "$WORKSPACE_PACKAGES" -gt 0 ]; then
              WORKSPACE_MODULES=$(find packages/*/node_modules apps/*/node_modules -maxdepth 0 -type d 2>/dev/null || true | wc -l | tr -d ' ')
              if [ "$WORKSPACE_MODULES" -eq 0 ]; then
                echo "⚠️ Workspace packages exist but no workspace node_modules found - forcing install"
                NEEDS_INSTALL=true
              fi
            fi
          fi
          
          if [ "$NEEDS_INSTALL" == "false" ]; then
            echo "✅ Cache integrity verified"
          fi
        fi
        
        # Check for monorepo configurations that need install
        if [ "$NEEDS_INSTALL" == "false" ]; then
          # 1. Workspaces: Check if workspace node_modules are cached
          #    If we cache workspace node_modules explicitly (apps/**/node_modules, packages/**/node_modules),
          #    then symlinks work correctly and we don't need to run install.
          #    If workspace node_modules are missing, we must run install to populate them.
          if grep -q '"workspaces"' package.json 2>/dev/null; then
            # Check if workspace node_modules directories exist (were cached)
            WORKSPACE_MODULES=$(find packages/*/node_modules apps/*/node_modules -maxdepth 0 -type d 2>/dev/null | wc -l | tr -d ' ')
            if [ "$WORKSPACE_MODULES" -gt 0 ]; then
              echo "✅ Workspaces detected with cached node_modules ($WORKSPACE_MODULES workspaces)"
              echo "   ✅ Workspace symlinks preserved - install NOT needed"
              NEEDS_INSTALL=false
            else
              echo "⚠️ Workspaces detected but workspace node_modules missing"
              echo "   ⚠️ Install needed to populate workspace directories"
              NEEDS_INSTALL=true
            fi
          fi
          
          # 2. Lerna monorepo: Need lerna bootstrap (usually in postinstall hook)
          if [ -f "lerna.json" ]; then
            echo "📦 Detected Lerna monorepo - install needed for lerna bootstrap"
            NEEDS_INSTALL=true
          fi
          
          # 3. Postinstall hook: install needed so we can run the root postinstall explicitly
          #    (dependency postinstall scripts are blocked by --ignore-scripts)
          if grep -q '"postinstall"' package.json 2>/dev/null; then
            echo "🔧 Detected postinstall hook - install needed to run root postinstall"
            NEEDS_INSTALL=true
            HAS_POSTINSTALL=true
          fi
        fi
        
        echo "needs-install=$NEEDS_INSTALL" >> $GITHUB_OUTPUT
        echo "has-postinstall=${HAS_POSTINSTALL:-false}" >> $GITHUB_OUTPUT
    
    - name: Log cache status and decision
      if: ${{ !env.ACT }}
      shell: bash
      run: |
        PM="${{ inputs.package-manager }}"

        # Read the key from the step output: re-running hashFiles('**/package.json') here,
        # after the restore, would glob every package.json inside node_modules (~30 s in big repos).
        CACHE_HIT="${{ steps.restore-cache.outputs.cache-hit }}"
        CACHE_KEY="${{ steps.cache-key.outputs.key }}"
        MATCHED_KEY="${{ steps.restore-cache.outputs.cache-matched-key }}"
        if [ "$PM" == "pnpm" ]; then
          INSTALL_CMD="pnpm install"
        else
          INSTALL_CMD="yarn install"
        fi

        echo "=== 📊 Cache Status Summary ==="
        if [ "$CACHE_HIT" == "true" ]; then
          echo "✅ Cache HIT - Dependencies restored from cache"
          echo "📦 Cache key: $CACHE_KEY"
          echo ""
          if [ "${{ steps.check-install-needed.outputs.needs-install }}" == "true" ]; then
            echo "🔄 Decision: WILL run $INSTALL_CMD"
            echo "Reasons: Cache verification failed, workspace linking needed, or postinstall hooks detected"
          else
            echo "⚡ Decision: SKIP $INSTALL_CMD"
            echo "Reason: Cache verified and no workspace linking or postinstall hooks required"
          fi
        else
          echo "❌ Cache MISS - Fresh installation required"
          echo "🔍 Looking for key: $CACHE_KEY"
          if [ -n "$MATCHED_KEY" ]; then
            echo "♻️ Restored fallback cache: $MATCHED_KEY"
          fi
          echo ""
          echo "🔄 Decision: WILL run $INSTALL_CMD"
          echo "💾 Save policy: ${{ steps.save-policy.outputs.mode }} (on default branch: ${{ steps.save-policy.outputs.on-default-branch }})"
        fi
        echo ""
    
    - name: Install Node.js dependencies (yarn)
      if: ${{ !env.ACT && inputs.package-manager != 'pnpm' && (steps.restore-cache.outputs.cache-hit != 'true' || steps.check-install-needed.outputs.needs-install == 'true') }}
      shell: bash
      run: yarn install --frozen-lockfile --ignore-scripts
      env:
        NODE_AUTH_TOKEN: ${{ inputs.GH_TOKEN }}
        PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

    - name: Run root postinstall script (yarn)
      if: ${{ !env.ACT && inputs.package-manager != 'pnpm' && steps.check-install-needed.outputs.has-postinstall == 'true' }}
      shell: bash
      run: |
        echo "🔧 Running root postinstall script"
        yarn run postinstall
      env:
        NODE_AUTH_TOKEN: ${{ inputs.GH_TOKEN }}

    - name: Install Node.js dependencies (pnpm)
      if: ${{ !env.ACT && inputs.package-manager == 'pnpm' && (steps.restore-cache.outputs.cache-hit != 'true' || steps.check-install-needed.outputs.needs-install == 'true') }}
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts
      env:
        NODE_AUTH_TOKEN: ${{ inputs.GH_TOKEN }}
        PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

    - name: Run root postinstall script (pnpm)
      if: ${{ !env.ACT && inputs.package-manager == 'pnpm' && steps.check-install-needed.outputs.has-postinstall == 'true' }}
      shell: bash
      run: |
        echo "🔧 Running root postinstall script"
        pnpm run postinstall
      env:
        NODE_AUTH_TOKEN: ${{ inputs.GH_TOKEN }}

    # Saved right after install (not in a post-job step), so the cache holds a clean install
    # and is written even if later steps fail. On a miss this is the slow part of the action,
    # which is why it is gated by save-cache:
    #   always         -> every miss
    #   default-branch -> only on the default branch
    #   auto           -> default branch, or anywhere when nothing at all was restored
    #   never          -> restore-only
    # PR and merge-queue refs can read caches saved on the default branch, never the reverse.
    - name: Save dependency cache
      if: >-
        ${{ !env.ACT && steps.restore-cache.outputs.cache-hit != 'true' && (
          steps.save-policy.outputs.mode == 'always' ||
          (steps.save-policy.outputs.mode != 'never' && steps.save-policy.outputs.on-default-branch == 'true') ||
          (steps.save-policy.outputs.mode == 'auto' && steps.restore-cache.outputs.cache-matched-key == '')
        ) }}
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.cache-paths.outputs.paths || steps.cache-paths-pnpm.outputs.paths }}
        key: ${{ steps.cache-key.outputs.key }}
